<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kiosk Digitaal 24h</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #000000;
      color: #00d4ff;
      font-family: 'Share Tech Mono', monospace;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      user-select: none;
    }
    .clock-container {
      text-align: center;
      position: relative;
      transition: transform 1s ease-in-out;
    }
    .time {
      font-size: 20vw;
      font-weight: 700;
      letter-spacing: 2px;
      line-height: 1;
      font-variant-numeric: tabular-nums;
      text-shadow: 
        0 0 12px rgba(0, 212, 255, 0.5),
        0 0 25px rgba(0, 212, 255, 0.2);
    }
    .dots {
      transition: opacity 0.2s ease;
    }
    .dots.dim {
      opacity: 0.15;
    }
    .date {
      font-size: 5.5vw;
      font-family: 'Orbitron', sans-serif;
      font-weight: 700;
      color: #888888;
      margin-top: 25px;
      letter-spacing: 3px;
      text-transform: uppercase;
    }
    .weather-info {
      font-size: 3.2vw;
      font-family: 'Orbitron', sans-serif;
      font-weight: 700;
      color: #888888;
      margin-top: 20px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    .wind-label {
      color: #888888;
    }
    .wind-dir {
      color: #ffffff;
    }
    .wind-speed {
      color: rgb(0, 200, 0);
    }
  </style>
</head>
<body>

  <div class="clock-container" id="clockContainer">
    <div id="time" class="time">
      <span id="hrs">00</span><span class="dots" id="dot1">:</span><span id="min">00</span><span class="dots" id="dot2">:</span><span id="sec">00</span>
    </div>
    <div id="date" class="date">MAANDAG 1 JANUARI</div>
    <div id="weather" class="weather-info">
      <span class="wind-label">WIND: </span>
      <span id="windDir" class="wind-dir">--</span> 
      <span id="windSpeed" class="wind-speed">-- BFT</span>
    </div>
  </div>

  <script>
    function updateClock() {
      const now = new Date();

      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const seconds = String(now.getSeconds()).padStart(2, '0');
      
      document.getElementById('hrs').textContent = hours;
      document.getElementById('min').textContent = minutes;
      document.getElementById('sec').textContent = seconds;

      const isEven = now.getSeconds() % 2 === 0;
      document.getElementById('dot1').classList.toggle('dim', !isEven);
      document.getElementById('dot2').classList.toggle('dim', !isEven);

      const options = { weekday: 'long', day: 'numeric', month: 'long' };
      document.getElementById('date').textContent = now.toLocaleDateString('nl-NL', options);
    }

    setInterval(updateClock, 1000);
    updateClock();

    // Inbrandbeveiliging
    setInterval(() => {
      const container = document.getElementById('clockContainer');
      const randomX = Math.floor(Math.random() * 20) - 10;
      const randomY = Math.floor(Math.random() * 20) - 10;
      container.style.transform = `translate(${randomX}px, ${randomY}px)`;
    }, 300000);

    // Kleurbepaling op basis van vorig project
    function getWindColor(speedVal) {
      const t = parseInt(speedVal, 10);
      if (isNaN(t)) return 'rgb(0, 200, 0)';

      if (t <= 2) return 'rgb(0, 200, 0)';     // Groen
      if (t <= 3) return 'rgb(200, 200, 0)';   // Geel
      if (t <= 5) return 'rgb(255, 120, 0)';   // Oranje
      return 'rgb(255, 0, 50)';                // Rood
    }

    // HA Webhook ophalen
    const HA_WEBHOOK_URL = 'http://192.168.1.109:8123/api/webhook/screensaver_wind_info';

    async function fetchHAWindData() {
      try {
        const response = await fetch(HA_WEBHOOK_URL);
        if (response.ok) {
          const data = await response.json();
          if (data.direction && data.speed) {
            document.getElementById('windDir').textContent = data.direction;
            
            const speedElem = document.getElementById('windSpeed');
            speedElem.textContent = `${data.speed} BFT`;
            speedElem.style.color = getWindColor(data.speed);
          }
        }
      } catch (error) {
        console.log('Fout bij ophalen HA data:', error);
      }
    }

    fetchHAWindData();
    setInterval(fetchHAWindData, 300000);
  </script>

</body>
</html>
