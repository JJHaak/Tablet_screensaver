<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kiosk Digitaal 24h</title>
  <!-- Digitale / Segment Fonts inladen via Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #000000;
      color: #00d4ff; /* 00ff66 Klassiek groen digitaal (verander naar #ffffff voor wit of #ff3300 voor rood) */
      font-family: 'Share Tech Mono', monospace;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      user-select: none;
    }
    .clock-container {
      text-align: center;
      position: relative;
    }
    .time {
      font-size: 20vw; /* Schaalt mee met het scherm */
      font-weight: 700;
      letter-spacing: 2px;
      line-height: 1;
      font-variant-numeric: tabular-nums;
      /* Optioneel: Digitale LED glow-effect */
      text-shadow: 0 0 20px rgba(0, 212, 255, 0.6), 0 0 40px rgba(0, 212, 255, 0.2);
    }
    .date {
      font-size: 5.5vw;
      font-family: 'Orbitron', sans-serif;
      font-weight: 700;
      color: #888888;
      margin-top: 25px;
      letter-spacing: 3px;
      text-transform: uppercase;
    }
  </style>
</head>
<body>

  <div class="clock-container">
    <div id="time" class="time">00:00:00</div>
    <div id="date" class="date">MAANDAG 1 JANUARI</div>
  </div>

  <script>
    function updateClock() {
      const now = new Date();

      // 24-uurs weergave afdwingen (HH:mm:ss)
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const seconds = String(now.getSeconds()).padStart(2, '0');
      
      document.getElementById('time').textContent = `${hours}:${minutes}:${seconds}`;

      // Datum weergeven
      const options = { weekday: 'long', day: 'numeric', month: 'long' };
      document.getElementById('date').textContent = now.toLocaleDateString('nl-NL', options);
    }

    setInterval(updateClock, 1000);
    updateClock();
  </script>

</body>
</html>
