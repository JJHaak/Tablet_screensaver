<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kiosk Screensaver</title>
  
  <!-- Orbitron & Share Tech Mono Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #000000;
      color: #00d4ff;
      font-family: 'Share Tech Mono', monospace;
      height: 100vh;
      width: 100vw;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      cursor: none;
    }

    /* Container voor inbrandbeveiliging (verschuift elke minuut lichtjes) */
    #screensaver-container {
      text-align: center;
      transition: transform 1s ease-in-out;
      will-change: transform;
    }

    /* 24-uurs Neon-Blauwe Klok */
    #clock {
      font-family: 'Orbitron', sans-serif;
      font-size: 11vw;
      font-weight: 700;
      color: #00d4ff;
      text-shadow: 0 0 20px rgba(0, 212, 255, 0.6), 0 0 40px rgba(0, 212, 255, 0.2);
      line-height: 1.1;
      margin-bottom: 10px;
    }

    /* Datum weergave (Grijs) */
    #date {
      font-size: 3.2vw;
      color: #888888;
      letter-spacing: 2px;
      margin-bottom: 25px;
      text-shadow: 0 0 5px rgba(255, 255, 255, 0.1);
    }

    /* Wind Informatie Block */
    #wind-info {
      font-size: 4vw;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
      margin-top: 10px;
    }

    /* Windrichting (Wit) */
    #windDir {
      color: #ffffff;
      font-weight: bold;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.4);
    }

    /* Windsnelheid (Dynamische kleur via JS) */
    #windSpeed {
      font-weight: bold;
      transition: color 0.5s ease;
      text-shadow: 0 0 10px rgba(0, 0, 0, 0.8);
    }
  </style>
</head>
<body>

  <div id="screensaver-container">
    <div id="clock">00:00:00</div>
    <div id="date">Laden...</div>
    <div id="wind-info">
      <span id="windDir">--</span>
      <span id="windSpeed">-- BFT</span>
    </div>
  </div>

  <script>
    // =========================================================================
    // CONFIGURATIE HOME ASSISTANT
    // =========================================================================
    const HA_URL = 'http://192.168.1.108:8123';
    const HA_TOKEN = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJlNjg1MDQ5ZGQyODQ0ZjdlYjMyM2RiN2IyMjk2YjdlOCIsImlhdCI6MTc5MTU1MzU0MSwiZXhwIjoyMTA2OTEzNTQxfQ.TdM9ZKMMa8SyR7DFZPk9Mly96kPyH4LkyvDFCHPg2aw';

    // =========================================================================
    // KLOK & DATUM FUNCTIE
    // =========================================================================
    function updateClock() {
      const now = new Date();
      
      // 24-uurs tijdsaanduiding
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const seconds = String(now.getSeconds()).padStart(2, '0');
      document.getElementById('clock').textContent = `${hours}:${minutes}:${seconds}`;

      // Datumweergave (Nederlands)
      const options = { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' };
      const dateStr = now.toLocaleDateString('nl-NL', options);
      document.getElementById('date').textContent = dateStr;
    }

    // =========================================================================
    // INBRANDBEVEILIGING (OLED / LCD BURNOUT PREVENTION)
    // Verschuift het scherm willekeurig max 20px elke 60 seconden
    // =========================================================================
    function preventBurnIn() {
      const container = document.getElementById('screensaver-container');
      const randomX = Math.floor(Math.random() * 41) - 20; // tussen -20px en +20px
      const randomY = Math.floor(Math.random() * 41) - 20; // tussen -20px en +20px
      container.style.transform = `translate(${randomX}px, ${randomY}px)`;
    }

    // =========================================================================
    // WIND INFORMATIE OPHALEN VIA HOME ASSISTANT API
    // =========================================================================
    function getWindColor(speedVal) {
      const t = parseInt(speedVal, 10);
      if (isNaN(t)) return '#00d4ff'; // Standaard blauw bij onbekend

      if (t <= 2) return 'rgb(0, 230, 118)';    /* Groen (<=2 Bft) */
      if (t <= 3) return 'rgb(255, 214, 0)';    /* Geel (3 Bft) */
      if (t <= 5) return 'rgb(255, 145, 0)';    /* Oranje (4-5 Bft) */
      return 'rgb(255, 23, 68)';                /* Rood (>5 Bft) */
    }

    async function fetchHAWindData() {
      try {
        const headers = {
          'Authorization': `Bearer ${HA_TOKEN}`,
          'Content-Type': 'application/json'
        };

        const [resDir, resSpeed] = await Promise.all([
          fetch(`${HA_URL}/api/states/sensor.weerlive_wind_direction`, { headers }),
          fetch(`${HA_URL}/api/states/sensor.weerlive_windforce`, { headers })
        ]);

        if (resDir.ok && resSpeed.ok) {
          const dataDir = await resDir.json();
          const dataSpeed = await resSpeed.json();

          // Update Windrichting (Wit)
          document.getElementById('windDir').textContent = dataDir.state;

          // Update Windsnelheid + Dynamische Kleur
          const speedElem = document.getElementById('windSpeed');
          speedElem.textContent = `${dataSpeed.state} BFT`;
          speedElem.style.color = getWindColor(dataSpeed.state);
        } else {
          console.error('API respons niet OK bij ophalen winddata');
        }
      } catch (error) {
        console.error('Fout bij verbinden met Home Assistant API:', error);
      }
    }

    // =========================================================================
    // INITIALISATIE & TIMERS
    // =========================================================================
    // Direct uitvoeren bij laden
    updateClock();
    preventBurnIn();
    fetchHAWindData();

    // Intervals instellen
    setInterval(updateClock, 1000);         // Klok elke seconde
    setInterval(preventBurnIn, 60000);       // Pixel shift elke minuut
    setInterval(fetchHAWindData, 300000);   // Winddata elke 5 minuten verversen
  </script>
</body>
</html>
